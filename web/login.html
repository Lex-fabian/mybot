<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión con Google — MyBot</title>
  <link rel="icon" type="image/png" href="icono.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 122, 255, 0.15);
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .logo-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(0, 122, 255, 0.2), rgba(0, 198, 255, 0.2));
      border: 1px solid rgba(0, 122, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
    }
    .logo-box img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-google {
      width: 100%;
      padding: 13px 20px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #ffffff;
      color: #1e293b;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .btn-google:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
      background: #f8fafc;
    }
    .btn-google:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-google:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 20px;
      min-height: 38px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .status-loading {
      color: #38bdf8;
    }
    .status-success {
      color: #4ade80;
      font-weight: 600;
      background: rgba(74, 222, 128, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .status-error {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      padding: 8px 12px;
      border-radius: 10px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-box">
      <img src="icono.png" alt="MyBot">
    </div>
    <h1 class="title">Bienvenido a MyBot</h1>
    <p class="subtitle">Inicia sesión con tu cuenta de Google para activar el software y comenzar tus transmisiones.</p>

    <button id="btnGoogle" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>

    <div id="statusBox" class="status-box"></div>

    <p class="footer-note">Autenticación segura respaldada por Google Firebase</p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      projectId: "mybot-79861",
      appId: "1:929325369614:web:552848363e69f7a2c1af5f",
      storageBucket: "mybot-79861.firebasestorage.app",
      apiKey: "AIzaSyBr_TIXjNmtV_sKBFVT_eWki-slPQ5NC14",
      authDomain: "mybot-79861.firebaseapp.com",
      messagingSenderId: "929325369614"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const btnGoogle = document.getElementById('btnGoogle');
    const statusBox = document.getElementById('statusBox');

    async function handleSignIn() {
      btnGoogle.disabled = true;
      statusBox.innerHTML = '<div class="spinner"></div><span class="status-loading">Conectando con Google...</span>';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        statusBox.innerHTML = '<div class="spinner"></div><span class="status-loading">Vinculando sesión con MyBot...</span>';

        const payload = {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || user.email?.split('@')[0] || 'Usuario',
          photoURL: user.photoURL || ''
        };

        const res = await fetch('/api/auth/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          statusBox.innerHTML = '<div class="status-success">✓ ¡Listo! Sesión iniciada con éxito. Ya puedes regresar a MyBot.</div>';
          setTimeout(() => {
            window.close();
          }, 2000);
        } else {
          throw new Error('Error al guardar la sesión en MyBot.');
        }
      } catch (err) {
        btnGoogle.disabled = false;
        if (err.code === 'auth/popup-closed-by-user') {
          statusBox.innerHTML = '<div class="status-error">Ventana cancelada. Pulsa Continuar para intentar de nuevo.</div>';
        } else {
          statusBox.innerHTML = `<div class="status-error">${err.message || 'No se pudo iniciar sesión.'}</div>`;
        }
      }
    }

    btnGoogle.addEventListener('click', handleSignIn);

    // Intentar abrir popup automáticamente al cargar
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        handleSignIn();
      }, 300);
    });
  </script>
</body>
</html>
